<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<style>
  .seed{transform-box:fill-box;transform-origin:center;animation:seed 6s cubic-bezier(.2,.8,.2,1) infinite}
  .connector{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 6s ease-in-out infinite}
  .m1{animation:m1 6s ease-in-out infinite}.m2{animation:m2 6s ease-in-out infinite}.m3{animation:m3 6s ease-in-out infinite}.m4{animation:m4 6s ease-in-out infinite}
  .brand{animation:brand 6s ease-in-out infinite}.tag{animation:tag 6s ease-in-out infinite}
  @keyframes seed{0%{transform:scale(.05);opacity:0}12%,22%{transform:scale(1);opacity:1}72%{transform:scale(1);opacity:1}92%,100%{transform:scale(.05);opacity:0}}
  @keyframes draw{0%,18%{stroke-dashoffset:420}48%,78%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:-420}}
  @keyframes m1{0%,22%{opacity:0;transform:translate(-60px,20px)}40%,82%{opacity:1;transform:none}96%,100%{opacity:0}}
  @keyframes m2{0%,30%{opacity:0;transform:translate(0,70px)}48%,82%{opacity:1;transform:none}96%,100%{opacity:0}}
  @keyframes m3{0%,38%{opacity:0;transform:translate(70px,-20px)}56%,82%{opacity:1;transform:none}96%,100%{opacity:0}}
  @keyframes m4{0%,46%{opacity:0;transform:translate(80px,60px)}64%,82%{opacity:1;transform:none}96%,100%{opacity:0}}
  @keyframes brand{0%,58%{opacity:0;transform:translateY(28px)}72%,90%{opacity:1;transform:none}100%{opacity:0}}
  @keyframes tag{0%,65%{opacity:0}78%,90%{opacity:1}100%{opacity:0}}
</style>
